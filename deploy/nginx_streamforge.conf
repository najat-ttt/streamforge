# NGINX rate limiting zone (place in http context)
limit_req_zone $binary_remote_addr zone=streamforge_zone:10m rate=30r/m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name streamforge-naj.duckdns.org;  # replace with your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name streamforge-naj.duckdns.org;  # replace with your domain

    # TLS certs (letsencrypt default paths — update if needed)
    ssl_certificate /etc/letsencrypt/live/streamforge-naj.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streamforge-naj.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Apply rate limiting per client IP
    limit_req zone=streamforge_zone burst=10 nodelay;

    # noVNC proxy (websockets)
    location /vnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Proxy requests to the FastAPI uvicorn instance
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Health endpoint (proxied directly)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Prometheus metrics (only accessible from localhost)
    location /metrics {
        proxy_pass http://127.0.0.1:8000/metrics;
        allow 127.0.0.1;
        deny all;
    }

    # Recommended security/timeouts
    keepalive_timeout 65;
    client_max_body_size 50M;
}