# NGINX rate limiting zone (adjust rate as needed)
# Place this file under /etc/nginx/sites-available and ensure it's loaded within the http context.
limit_req_zone $binary_remote_addr zone=streamforge_zone:10m rate=30r/m;

server {
    listen 80;
    server_name your.domain.com; # replace with your domain or public IP

    # Apply rate limiting per client IP
    limit_req zone=streamforge_zone burst=10 nodelay;

    # Proxy requests to the FastAPI uvicorn instance
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Health endpoint (proxied directly)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Prometheus metrics (optional) - do not expose publicly unless desired
    location /metrics {
        proxy_pass http://127.0.0.1:8000/metrics;
        allow 127.0.0.1;
        deny all;
    }

    # Optional: serve static assets if you add any
    # location /static/ {
    #     alias /home/streamforge/streamforge-backend/static/;
    # }

    # Recommended security/timeouts
    keepalive_timeout 65;
    client_max_body_size 50M;
}

# To enable, place this file in /etc/nginx/sites-available/streamforge
# then link: ln -s /etc/nginx/sites-available/streamforge /etc/nginx/sites-enabled/